<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datenschutz – Hartholz Tischlerei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .legal-page { padding-top: calc(var(--nav-h) + 5rem); padding-bottom: 6rem; }
    .legal-content { max-width: 760px; margin: 0 auto; padding: 0 5vw; }
    .legal-content h1 {
      font-size: clamp(2.2rem, 3.5vw, 3.2rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }
    .legal-meta {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 3rem;
    }
    .legal-block { margin-bottom: 2.5rem; }
    .legal-block h2 {
      font-size: 0.82rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .legal-block p, .legal-block address {
      font-size: 1.03rem;
      color: var(--mid);
      line-height: 1.8;
      font-style: normal;
    }
    .legal-block a { color: var(--wood); text-decoration: none; }
    .legal-block a:hover { color: var(--dark); }
    .legal-block p + p { margin-top: 0.75rem; }
  </style>
